baseURL = "https://jed.codes/"
languageCode = "en-us"
title = "jed.codes"
theme = "hugo-ink"
[pagination]
pagerSize = 5

copyright = "© 2020"

googleAnalytics = "UA-158554300-1"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3

[params]
subtitle = "Let me fix that problem for you."
favicon = "git-merge.ico"
customCSS = "css/custom.css"

# Optional 64x64 avatar image.
avatar = "https://gravatar.com/avatar/e90b0742a0a78f583355470561d63197"

# Content types to disable Disqus on.
disableDisqusTypes = ["page", "post"]

# mailchimp
[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "About"
url = "/about"
weight = 2

[[menu.main]]
name = "Contact"
url = "/contact"
weight = 3

[[menu.main]]
name = "Services"
url = "/services"
weight = 4

[[menu.main]]
name = "Tags"
url = "/tags/"
weight = 5

[[menu.main]]
name = "Search"
url = "/search/"
weight = 6


featherIconsCDN = true

[[params.social]]
name = "Github"
icon = "github"
url = "https://github.com/jedschneider"

[[params.social]]
name = "RSS"
icon = "rss"
url = "/index.xml"

[taxonomies]
   tag = "tags"

[security]
allowContent = ['text/html', 'text/markdown', 'text/asciidoc', 'text/x-org']
