<!DOCTYPE html>
<html>
{{ partial "header.html" . }}
<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<body>
	<div class="container wrapper">
		{{ partial "head.html" . }}

		<h2 class="page-title">{{ .Title }}</h2>

		<div id="search"></div>

		<script src="/pagefind/pagefind-ui.js"></script>
		<script>
			window.addEventListener('DOMContentLoaded', () => {
				new PagefindUI({
					element: "#search",
					showSubResults: true,
					showImages: false
				});
			});
		</script>
	</div>
	{{ partial "footer.html" . }}
</body>
</html>
